name: CI
permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
  workflow_dispatch: {}

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run ShellCheck
        uses: Azbagheri/shell-linter@latest
        with:
          severity: style
          exclude-paths: LICENSE

  test:
    name: Test dotfiles
    runs-on: ubuntu-latest

    needs: lint

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run bootstap.sh
        run: "$(which bash) bootstrap.sh"
