---
palette:
    blue: '#89B4FA'
    closer: p:os
    lavender: '#B4BEFE'
    os: '#ACB0BE'
    pink: '#F5C2E7'
secondary_prompt:
    template: '❯❯ '
    foreground: '#FEF5ED'
    background: transparent
transient_prompt:
    template: '❯ '
    foreground: '#FEF5ED'
    background: transparent
blocks:
    - type: prompt
      alignment: left
      segments:
        - properties:
            cache_duration: none
          template: '{{.Icon}} '
          foreground: p:os
          type: os
          style: plain
        - properties:
            cache_duration: none
            home_icon: "~"
            style: full
          template: '{{ .Path }} '
          foreground: p:pink
          type: path
          style: plain
        - properties:
            branch_icon: ""
            cache_duration: none
            fetch_status: true
            fetch_upstream_icon: true
            fetch_user: true
            source: cli
          template: on {{ .HEAD }}{{if .Working.Changed }}*{{ end }}
          foreground: p:lavender
          type: git
          style: plain
      newline: true
    - type: prompt
      alignment: left
      segments:
        - properties:
            cache_duration: none
          template: '❯'
          foreground: p:closer
          type: text
          style: plain
      newline: true
version: 3
final_space: true
