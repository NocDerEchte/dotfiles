---
palette:
  os: '#ACB0BE'
  closer: 'p:os'
  pink: '#F5C2E7'
  lavender: '#B4BEFE'
  blue: '#89B4FA'
blocks:
  - type: prompt
    alignment: left
    segments:
      - type: os
        foreground: 'p:os'
        style: plain
        template: '{{.Icon}} '
      - type: path
        foreground: 'p:pink'
        properties:
          home_icon: '~'
          style: full
        style: plain
        template: '{{ .Path }} '
      - type: git
        foreground: 'p:lavender'
        properties:
          fetch_status: true
          fetch_upstream_icon: true
          fetch_user: true
          branch_icon: ''
          source: cli
        template: 'on {{ .HEAD }}{{if .Working.Changed }}*{{ end }}'
        style: plain
      - type: kubectl
        style: powerline
        foreground: 'p:os'
        template: " |  {{ if .Cluster }}{{ .Cluster }}{{ end }}{{ if .Namespace }}:{{ .Namespace }}{{ end }} "
      - type: text
        style: plain
        foreground: 'p:closer'
        template: |2-

           
final_space: true
transient_prompt:
  background: transparent
  foreground: '#FEF5ED'
  template: "{{ .Shell }}> "
version: 3
