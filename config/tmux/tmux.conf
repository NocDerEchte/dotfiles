# tmux.conf

# source themes
source -F "#{d:current_file}/themes/catppuccin_mocha.conf"

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -g allow-passthrough on # required for omp transient prompt

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# copy mode
setw -g mode-style 'fg=#{@crust} bg=#{@mauve} bold'

# panes
set -g pane-border-style 'fg=#{@blue}'
set -g pane-active-border-style 'fg=#{@teal}'

## statusbar
set -g status-position top
set -g status-justify left
set -g status-style 'fg=#{@surface1}'

# left
set -g status-left 'Session: #S '
set -g status-left-length 50

# rigth
set -g status-right '#($XDG_CONFIG_HOME/tmux/status/kube) | '
set -ag status-right '#($XDG_CONFIG_HOME/tmux/status/memory)'
set -g status-right-length 50

setw -g window-status-current-format '#[bg=#{@overlay1}] #I #W #F '
setw -g window-status-format '#[fg=#{@surface1}] #I #W #F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'

## popup windows

# create new session
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" session_name; tmux new-session -d -s \$session_name && tmux switch-client -t \$session_name"'

# attach to session
bind C-c display-popup -E 'bash -i -c "tmux list-sessions | cut -d: -f1 - | fzf --reverse | xargs tmux switch-client -t "'

# delete session
bind C-d display-popup -E 'bash -i -c "tmux list-sessions | cut -d: -f1 - | fzf --reverse | xargs tmux kill-session -t "'

# lazygit
bind C-y display-popup -d '#{pane_current_path}' -w 90% -h 100% -E '~/.local/bin/lazygit'
