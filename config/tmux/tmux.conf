# tmux.conf

# Source themes
source -F "#{d:current_file}/themes/catppuccin_mocha.conf"

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -g allow-passthrough on # required for omp transient prompt

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# copy mode
setw -g mode-style 'fg=#{@crust} bg=#{@mauve} bold'

# panes
set -g pane-border-style 'fg=#{@blue}'
set -g pane-active-border-style 'fg=#{@teal}'

# statusbar
set -g status-position top
set -g status-justify left
set -g status-style 'fg=#{@surface1}'

set -g status-right '#($XDG_CONFIG_HOME/tmux/status/kube) | '
set -ag status-right '#($XDG_CONFIG_HOME/tmux/status/memory)'
set -g status-right-length 50

setw -g window-status-current-format '#[bg=#{@overlay1}] #I #W #F '
setw -g window-status-format '#[fg=#{@surface1}] #I #W #F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'
